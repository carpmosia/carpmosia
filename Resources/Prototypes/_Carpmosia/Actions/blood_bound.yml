- type: entity
  parent: BaseAction
  id: ActionBloodBoundConvert
  name: Convert
  description: Convert a crewmember to your blood oath.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Alerts/bleed.rsi
    layers:
    - state: bleed10
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:BloodBoundConvertActionEvent
    whitelist:
      components:
      - HumanoidProfile
    canTargetSelf: false

- type: entity
  parent: BaseAction
  id: ActionBloodBoundCheckConvert
  name: Check If Convertible
  description: Check if a crewmember is susceptible to conversion.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/VerbIcons/vv.svg.192dpi.png # eye icon
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:BloodBoundCheckConvertActionEvent
    whitelist:
      components:
      - HumanoidProfile
    canTargetSelf: false
