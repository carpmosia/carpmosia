# Security
- type: constructionGraph
  id: GlassesSecurityPrescription
  start: start
  graph:
  - node: start
    edges:
    - to: done
      steps:
      - tag: GlassesPrescription
        name: construction-graph-tag-glasses
        icon:
          sprite: Clothing/Eyes/Glasses/glasses.rsi
          state: icon
      - tag: HudSecurity
        name: construction-graph-tag-security-hud
        icon:
          sprite: Clothing/Eyes/Hud/sec.rsi
          state: icon
      - material: Cable
        amount: 5
        doAfter: 5
  - node: done
    entity: ClothingEyesGlassesSecurityPrescription

