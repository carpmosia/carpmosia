- type: entity
  parent: BaseComputerShuttle
  id: ComputerShuttleSalvage
  name: salvage shuttle console
  description: Used to pilot the salvage shuttle.
  components:
    - type: Sprite
      layers:
      - map: ["computerLayerBody"]
        state: computer
      - map: ["computerLayerKeyboard"]
        state: generic_keyboard
      - map: ["computerLayerScreen"]
        state: shuttle
      - map: ["computerLayerKeys"]
        state: generic_keys
    - type: DroneConsole
      components:
      - type: SalvageShuttle
    - type: RadarConsole
      maxRange: 256
    - type: PointLight
      radius: 1.5
      energy: 1.6
      color: "#43ccb5"
    - type: Computer
      board: SalvageShuttleConsoleCircuitboard
    - type: StealTarget
      stealGroup: SalvageShuttleConsoleCircuitboard

# Used for event spawned Shuttles that spawn off the station map
- type: entity
  parent: ComputerShuttle
  id: ComputerShuttleEvent
  suffix: FTL
  components:
  - type: ShuttleConsole
    ftlAllowed: true

- type: entity
  id: ComputerSupermatterMonitor
  parent: BaseComputerAiAccess
  name: supermatter monitoring console
  description: Used to manage currently active bounties.
  components:
  - type: Sprite
    sprite: _Carpmosia/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: tech_key_off
    - map: ["computerLayerScreen"]
      state: supermatter
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: CargoBountyConsole
  - type: ActivatableUI
    key: enum.CargoConsoleUiKey.Bounty
  - type: UserInterface
    interfaces:
      enum.CargoConsoleUiKey.Bounty:
        type: CargoBountyConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: CargoBountyComputerCircuitboard
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSink
    ports:
      - SupermatterDataReceiver
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#b89f25"
  - type: AccessReader
    access: [["Quartermaster"]]
  - type: GuideHelp
    guides:
    - CargoBounties
    - Cargo
