- type: entity
  parent: BaseComputerShuttle
  id: ComputerShuttleSalvage
  name: salvage shuttle console
  description: Used to pilot the salvage shuttle.
  components:
    - type: Sprite
      layers:
      - map: ["computerLayerBody"]
        state: computer
      - map: ["computerLayerKeyboard"]
        state: generic_keyboard
      - map: ["computerLayerScreen"]
        state: shuttle
      - map: ["computerLayerKeys"]
        state: generic_keys
    - type: DroneConsole
      components:
      - type: SalvageShuttle
    - type: RadarConsole
      maxRange: 256
    - type: PointLight
      radius: 1.5
      energy: 1.6
      color: "#43ccb5"
    - type: Computer
      board: SalvageShuttleConsoleCircuitboard
    - type: StealTarget
      stealGroup: SalvageShuttleConsoleCircuitboard

# Used for event spawned Shuttles that spawn off the station map
- type: entity
  parent: ComputerShuttle
  id: ComputerShuttleEvent
  suffix: FTL
  components:
  - type: ShuttleConsole
    ftlAllowed: true

- type: entity
  parent: BaseComputerAiAccess
  id: NuclearReactorMonitor
  name: Nuclear Reactor Monitor
  description: A device that monitors the state of a connected nuclear reactor.
  components:
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#c9c042"
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: power_monitor
  - type: NuclearReactorMonitor
  - type: ActivatableUI
    key: enum.NuclearReactorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NuclearReactorUiKey.Key:
        type: NuclearReactorBoundUserInterface
  - type: AccessReader # You got a permit for that meltdown?
    access: [["Engineering"]]
  - type: Lock
    unlockOnClick: false
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: DeviceLinkSink
    ports:
      - NuclearReactorDataReceiver
  - type: Computer
    board: NuclearReactorMonitorComputerCircuitboard
  - type: ContainerContainer
    containers:
      board: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container

