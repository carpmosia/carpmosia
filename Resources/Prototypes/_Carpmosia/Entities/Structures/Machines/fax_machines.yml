## Mapping prototypes

# Departmental Faxes
- type: entity
  parent: [FaxMachineBase, BaseCommandContraband]
  id: DepartmentalFaxMachineBridge
  name: bridge long range fax machine
  suffix: Bridge
  components:
  - type: FaxMachine
    name: "Bridge"
  - type: Sprite
    layers:      
    - state: icon
    - state: cover-icon
      color: "#334e6d"
    - state: idle
      map: [ "faxEyes" ]
    - state: printing
      map: [ "printing" ]
      visible: false
    - state: 
      map: [ "enum.FaxMachineVisuals.VisualState" ]

