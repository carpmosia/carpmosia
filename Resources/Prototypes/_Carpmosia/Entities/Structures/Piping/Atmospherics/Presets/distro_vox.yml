- type: entity
  abstract: true
  id: BaseAtmosNitrogen
  placement:
    mode: SnapgridCenter
  components:
  - type: AtmosPipeColor
    color: '#FF1212FF'

# Pipes
- type: entity
  parent: [BaseAtmosNitrogen, GasPipeStraightAlt2]
  id: GasPipeStraightNitrogen
  suffix: Nitrogen, Straight

- type: entity
  parent: [BaseAtmosNitrogen, GasPipeBendAlt2]
  id: GasPipeBendNitrogen
  suffix: Nitrogen, Bend

- type: entity
  parent: [BaseAtmosNitrogen, GasPipeTJunctionAlt2]
  id: GasPipeTJunctionNitrogen
  suffix: Nitrogen, TJunction

- type: entity
  parent: [BaseAtmosNitrogen, GasPipeFourwayAlt2]
  id: GasPipeFourwayNitrogen
  suffix: Nitrogen, Fourway

# Unary
- type: entity
  parent: [BaseAtmosNitrogen, AirSensorVoxBase, GasVentPumpAlt2]
  id: GasVentPumpNitrogen
  suffix: Nitrogen

- type: entity
  parent: [BaseAtmosNitrogen, AirSensorVoxBase, GasVentScrubberAlt3]
  id: GasVentScrubberNitrogen
  suffix: Nitrogen
  components:
  - type: GasVentScrubber
    wideNet: true # Air alarm with auto mode overrides filters with hardcoded defaults so default to widenet
    filterGases:
    - Oxygen # filter out oxygen as well as regular harmful gases
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon

# Binary
- type: entity
  parent: [BaseAtmosNitrogen, GasPressurePumpAlt2]
  id: GasPressurePumpNitrogen
  suffix: Nitrogen
  components:
  - type: GasPressurePump
    enabled: true
    targetPressure: 303.9

- type: entity
  parent: [BaseAtmosNitrogen, GasValveAlt2]
  id: GasValveNitrogen
  suffix: Nitrogen
  components:
  - type: GasValve
    open: true

- type: entity
  parent: [BaseAtmosNitrogen, GasPortAlt2]
  id: GasPortNitrogen
  suffix: Nitrogen
