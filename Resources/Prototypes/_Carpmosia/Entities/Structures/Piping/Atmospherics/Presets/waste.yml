- type: entity
  abstract: true
  id: BaseAtmosWaste
  placement:
    mode: SnapgridCenter
  components:
  - type: AtmosPipeColor
    color: '#ad46ffff'

# Pipes
- type: entity
  parent: [BaseAtmosWaste, GasPipeStraightAlt3]
  id: GasPipeStraightWaste
  suffix: Ẇaste, Straight

- type: entity
  parent: [BaseAtmosWaste, GasPipeBendAlt3]
  id: GasPipeBendWaste
  suffix: Ẇaste, Bend

- type: entity
  parent: [BaseAtmosWaste, GasPipeTJunctionAlt3]
  id: GasPipeTJunctionWaste
  suffix: Ẇaste, TJunction

- type: entity
  parent: [BaseAtmosWaste, GasPipeFourwayAlt3]
  id: GasPipeFourwayWaste
  suffix: Ẇaste, Fourway

- type: entity
  parent: [BaseAtmosWaste, GasPipeManifold]
  id: GasPipeManifoldWaste
  suffix: Waste

# Unary
- type: entity
  parent: [BaseAtmosWaste, GasPassiveVentAlt3]
  id: GasPassiveVentWaste
  suffix: Waste

- type: entity
  parent: [BaseAtmosWaste, GasVentScrubberAlt3]
  id: GasVentScrubberWaste
  suffix: Waste

- type: entity
  parent: [BaseAtmosWaste, GasOutletInjectorAlt3]
  id: GasOutletInjectorWaste
  suffix: Waste

# Binary
- type: entity
  parent: [BaseAtmosWaste, GasPressurePumpAlt3]
  id: GasPressurePumpWaste
  suffix: Waste
  components:
  - type: GasPressurePump
    enabled: true
    targetPressure: 4500

- type: entity
  parent: [BaseAtmosWaste, GasPassiveGateAlt3]
  id: GasPassiveGateWaste
  suffix: Waste

- type: entity
  parent: [BaseAtmosWaste, GasValveAlt3]
  id: GasValveWaste
  suffix: Waste
  components:
  - type: GasValve
    open: true

- type: entity
  parent: [BaseAtmosWaste, GasPortAlt3]
  id: GasPortWaste
  suffix: Waste

- type: entity
  parent: [BaseAtmosWaste, GasPipeSensorAlt3]
  id: GasPipeSensorWaste
  suffix: Waste
  components:
  - type: Label
    localizedLabel: gas-pipe-sensor-waste-loop

# Trinary
- type: entity
  parent: [BaseAtmosWaste, GasFilterAlt3]
  id: GasFilterWaste
  suffix: Waste
  components:
  - type: GasFilter
    enabled: true

- type: entity
  parent: [BaseAtmosWaste, GasFilterFlippedAlt3]
  id: GasFilterFlippedWaste
  suffix: Flipped, Waste
  components:
  - type: GasFilter
    enabled: true
