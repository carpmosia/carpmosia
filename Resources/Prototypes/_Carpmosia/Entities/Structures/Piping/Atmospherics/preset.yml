# Distro
- type: entity
  abstract: true
  id: BaseAtmosDistro
  placement:
    mode: SnapgridCenter
  components:
  - type: AtmosPipeColor
    color: '#0055CCFF'

# Distro pipes
- type: entity
  parent: [BaseAtmosDistro, GasPipeHalfAlt4]
  id: GasPipeHalfDistro
  suffix: Half, Distro

- type: entity
  parent: [BaseAtmosDistro, GasPipeStraightAlt4]
  id: GasPipeStraightDistro
  suffix: Straight, Distro

- type: entity
  parent: [BaseAtmosDistro, GasPipeBendAlt4]
  id: GasPipeBendDistro
  suffix: Bend, Distro

- type: entity
  parent: [BaseAtmosDistro, GasPipeTJunctionAlt4]
  id: GasPipeTJunctionDistro
  suffix: TJunction, Distro

- type: entity
  parent: [BaseAtmosDistro, GasPipeFourwayAlt4]
  id: GasPipeFourwayDistro
  suffix: Fourway, Distro

# Distro unary
- type: entity
  parent: [BaseAtmosDistro, GasVentPumpAlt4]
  id: GasVentPumpDistro
  suffix: Distro
  components:
  - type: GasPressurePump
    enabled: true
    targetPressure: 303.9

# Distro binary
- type: entity
  parent: [BaseAtmosDistro, GasPressurePumpAlt4]
  id: GasPressurePumpDistro
  suffix: Distro

- type: entity
  parent: [BaseAtmosDistro, GasValveAlt4]
  id: GasValveDistro
  suffix: Distro
  components:
  - type: GasValve
    open: true

- type: entity
  parent: [BaseAtmosDistro, GasPortAlt4]
  id: GasPortDistro
  suffix: Distro

# Distro trinary
- type: entity
  parent: [BaseAtmosDistro, GasMixerAlt4]
  id: GasMixerDistro
  suffix: Distro
  components:
  - type: GasMixer
    enabled: true
    targetPressure: 4500
    inletOneConcentration: 0.78
    inletTwoConcentration: 0.22

- type: entity
  parent: [BaseAtmosDistro, GasMixerFlippedAlt4]
  id: GasMixerFlippedDistro
  suffix: Flipped, Distro
  components:
  - type: GasMixer
    enabled: true
    targetPressure: 4500
    inletOneConcentration: 0.78
    inletTwoConcentration: 0.22

# Waste
- type: entity
  abstract: true
  id: BaseAtmosWaste
  placement:
    mode: SnapgridCenter
  components:
  - type: AtmosPipeColor
    color: '#990000FF'

# Waste pipes
- type: entity
  parent: [BaseAtmosWaste, GasPipeHalfAlt3]
  id: GasPipeHalfWaste
  suffix: Half, Waste

- type: entity
  parent: [BaseAtmosWaste, GasPipeStraightAlt3]
  id: GasPipeStraightWaste
  suffix: Straight, Waste

- type: entity
  parent: [BaseAtmosWaste, GasPipeBendAlt3]
  id: GasPipeBendWaste
  suffix: Bend, Waste

- type: entity
  parent: [BaseAtmosWaste, GasPipeTJunctionAlt3]
  id: GasPipeTJunctionWaste
  suffix: TJunction, Waste

- type: entity
  parent: [BaseAtmosWaste, GasPipeFourwayAlt3]
  id: GasPipeFourwayWaste
  suffix: Fourway, Waste

# Waste unary
- type: entity
  parent: [BaseAtmosWaste, GasVentScrubberAlt3]
  id: GasVentScrubberWaste
  suffix: Waste

- type: entity
  parent: [BaseAtmosWaste, GasOutletInjectorAlt3]
  id: GasOutletInjectorWaste
  suffix: Waste

# Waste binary
- type: entity
  parent: [BaseAtmosWaste, GasPressurePumpAlt3]
  id: GasPressurePumpWaste
  suffix: Waste
  components:
  - type: GasPressurePump
    enabled: true
    targetPressure: 4500

- type: entity
  parent: [BaseAtmosWaste, GasValveAlt3]
  id: GasValveWaste
  suffix: Waste
  components:
  - type: GasValve
    open: true

- type: entity
  parent: [BaseAtmosWaste, GasPortAlt3]
  id: GasPortWaste
  suffix: Waste

# Waste trinary
- type: entity
  parent: [BaseAtmosWaste, GasFilterAlt3]
  id: GasFilterWaste
  suffix: Waste
  components:
  - type: GasFilter
    enabled: true

- type: entity
  parent: [BaseAtmosWaste, GasFilterFlippedAlt3]
  id: GasFilterFlippedWaste
  suffix: Flipped, Waste
  components:
  - type: GasFilter
    enabled: true
