- type: entity
  id: Supermatter
  name: Supermatter Crystal
  description: An extremely dense, unstable crystal of pure matter. Its crystalline structure ensures crystal's integrity, but any external force can trigger the fission process.
  components:
  - type: Supermatter
  - type: RadiationSource
    intensity: 0
    slope: 10
  - type: AtmosDevice
    requireAnchored: false
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      SupermatterCollider:
        shape:
          !type:PhysShapeCircle
            radius: 0.35
        hard: true
        restitution: 0.8
        density: 99999
        mask:
        - SingularityLayer
        layer:
        - SingularityLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: PointLight
    color: "#F4CF3AFF"
    radius: 2.5
    energy: 5
  - type: Appearance
  - type: Sprite
    sprite: _Carpmosia/Structures/Power/Generation/supermatter.rsi
    snapCardinals: true
    layers:
    - map: [ "VisualLevel" ]
      state: supermatter

