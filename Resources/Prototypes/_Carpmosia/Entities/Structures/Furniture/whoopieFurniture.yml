- type: entity #whoopie component. adding this as additional parent and then we have haha-fartbuckle.
  name: Whoopie Base
  suffix: whoopie
  abstract: true
  id: WhoopieBase
  components:
  - type: Strap
    buckleSound:
      collection: Parp
      params:
        variation: 0.125

#beds
- type: entity 
  parent: [Bed, WhoopieBase]
  id: WhoopieBed
  components:
  - type: Construction
    graph: bed
    node: bedWhoopie
  - &whoopieDestructible
    type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          WhoopieCushion:
            min: 1
            max: 1

- type: entity
  parent: [MedicalBed, WhoopieBase]
  id: WhoopieMedicalBed
  components:
  - type: Construction
    graph: bed
    node: medicalbedWhoopie
  - type: PlaceableSurface # has to be redefined here after Construction or constructing wont work (dang.)
    placeCentered: true
  - *whoopieDestructible

- type: entity
