- type: entity #whoopie component. adding this as additional parent and then we have haha-fartbuckle.
  abstract: true
  id: WhoopieBase
  suffix: whoopie
  components:
  - type: Strap
    buckleSound:
      collection: Parp
      params:
        variation: 0.125
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          WhoopieCushion:
            min: 1
            max: 1

