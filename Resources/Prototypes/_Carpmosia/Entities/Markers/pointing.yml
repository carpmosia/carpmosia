- type: entity
  abstract: true
  id: PointerBase
  name: pointing arrow # they don't need unique names
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: Sprite
    sprite: _Carpmosia/Interface/Misc/pointing.rsi
    state: arrow
    drawdepth: Overlays
    noRot: true
  - type: PointingArrow
    duration: 4
    step: 0.5
    speed: 1
  - type: Appearance

- type: entity
  parent: PointerBase
  id: PointerArrow # Functionally identical to upstream pointer, but using our RSI

- type: entity
  parent: PointerBase
  id: PointerSharp
  components:
  - type: Sprite
    state: dagger

- type: entity
  parent: PointerBase
  id: PointerBlunt
  components:
  - type: Sprite
    state: crowbar

- type: entity
  parent: PointerBase
  id: PointerCrosshair
  components:
  - type: Sprite
    state: crosshair

- type: entity
  parent: PointerBase
  id: PointerMusic
  components:
  - type: Sprite
    state: note
