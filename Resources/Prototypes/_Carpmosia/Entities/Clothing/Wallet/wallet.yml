
# base
- type: entity
  parent: [Clothing, BaseStorageItem]
  id: Wallet
  name: wallet
  description: Never leave the station without it!
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,1
  - type: Clothing
    slots: [belt]
  - type: Storage
    grid:
    - 0,0,2,1
    whitelist:
      components:
      - Currency  # salvage tickets, speso
      - Paper  # idk you can probaly shove a sheet of paper or note in there??
    maxItemSize: Small
  - type: Sprite
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet.rsi
    storedSprite:
      state: icon
      sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet.rsi
    state: icon
  - type: ItemMapper
    sprite: &WalletOverlay _Carpmosia/Clothing/Wallet/Wallets/wallet_overlays.rsi
    mapLayers:
      speso:
        whitelist:
          components:
          - Cash
      paper:
        whitelist:
          components:
          - Paper
      ticket:
        whitelist:
          tags:
          - SalvageTicket
  - type: UseDelay
    delay: 0.5
  - type: Appearance
  - type: Tag
    tags:
    - Wallet

- type: entity
  parent: Wallet
  id: WalletCaptain
  name: Captain's Wallet
  components:
  - type: Sprite
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet-captain.rsi
    state: icon

- type: entity
  parent: Wallet
  id: WalletCentComm
  name: CentComm Wallet
  components:
  - type: Sprite
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet-centcomm.rsi
    state: icon

- type: entity
  parent: Wallet
  id: WalletSyndicate
  name: SyndieWallet
  components:
  - type: Sprite
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet-syndicate.rsi
    state: icon

- type: entity
  parent: Wallet
  id: WalletClown
  name: Honk Wallet
  description: Because you can't buy things with happiness.
  components:
  - type: Sprite
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet-clown.rsi
    state: icon
