
# for pre-filled wallets
- type: entity
  parent: SpaceCash
  id: SpaceCash250
  suffix: 250
  categories: [ HideSpawnMenu ]  # no clutter
  components:
  - type: Icon
    sprite: Objects/Economy/cash.rsi
    state: cash_100
  - type: Stack
    count: 250

- type: entityTable
  id: WalletStandardFillTable
  table: !type:GroupSelector
    rolls: 1, 3
    children: # EV = 1066.5
    - id: SpaceCash10
      weight: 5
    - id: SpaceCash100
      weight: 30
    - id: SpaceCash250
      weight: 30
    - id: SpaceCash500
      weight: 20
    - id: SpaceCash1000
      weight: 15

- type: entityTable
  id: WalletRichFillTable
  table: !type:GroupSelector
    rolls: 1, 3
    children: # EV = 1717.5
    - id: SpaceCash100
      weight: 10
    - id: SpaceCash250
      weight: 35
    - id: SpaceCash500
      weight: 30
    - id: SpaceCash1000
      weight: 20
    - id: SpaceCash2500
      weight: 5

- type: entityTable
  id: WalletSyndicateTelecrystalFillTable
  table: !type:AllSelector
    children:
      - !type:GroupSelector
        rolls: 1, 2
        children:
        - id: Telecrystal1
          weight: 30
        - id: Telecrystal5
          weight: 40
        - id: Telecrystal10
          weight: 40
      - !type:GroupSelector
        rolls: 1, 2
        children:
        - id: SpaceCash10
          weight: 5
        - id: SpaceCash100
          weight: 30
        - id: SpaceCash250
          weight: 30
        - id: SpaceCash500
          weight: 20
        - id: SpaceCash1000
          weight: 15

# base
- type: entity
  parent: [ Clothing, BaseStorageItem ]
  id: Wallet
  name: wallet
  description: Never leave the station without it!
  components:
  - type: Item
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet.rsi
    size: Small
    shape:
    - 0,0,1,1
  - type: Clothing
    slots: [belt, wallet]
  - type: Storage
    grid:
    - 0,0,1,1
    - 3,0,4,1
    whitelist:
      components:
      - Currency  # salvage tickets, spesos, telecrystals
      - Paper  # idk you can probably shove a sheet of paper or note in there??
      - Pill  # by popular demand
    maxItemSize: Small
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SharedBagOpenVisuals.BagState:  # stolen from BaseBagOpenClose, not parented as one day intend to do fancier things with the overlay sprites
        closeLayer:
          Open: { visible: false }
          Closed: { visible: true }
        openLayer:
          Open: { visible: true }
          Closed: { visible: false }
        # speso:  # one day...
        #   Open: { visible: true }
        #   Closed: { visible: false }
  - type: Sprite
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet.rsi
    layers:
    - state: open
      map: ["openLayer"]
    - state: speso
      map: ["speso"]
      sprite: &WalletOverlay _Carpmosia/Clothing/Wallet/Wallets/wallet_overlays.rsi
      visible: false
    - state: paper
      map: ["paper"]
      sprite: *WalletOverlay
      visible: false
    - state: ticket
      map: ["ticket"]
      visible: false
      sprite: *WalletOverlay
    - state: telecrystal
      map: ["telecrystal"]
      visible: false
      sprite: *WalletOverlay
    - state: closed  # render closed state last so it hides the overlay sprites under it.
      map: ["closeLayer"]
  - type: ItemMapper
    sprite: *WalletOverlay
    mapLayers:
      speso:
        whitelist:
          components:
          - Cash
      paper:
        whitelist:
          components:
          - Paper
      ticket:
        whitelist:
          tags:
          - SalvageTicket
      telecrystal:
        whitelist:
          tags:
          - Telecrystal
  - type: UseDelay
    delay: 0.5
  - type: Tag
    tags:
    - Wallet

- type: entity
  parent: Wallet
  id: WalletCaptain
  name: Captain's Wallet
  components:
  - type: Sprite
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet-captain.rsi
    state: closed

- type: entity
  parent: Wallet
  id: WalletCentComm
  name: CentComm Wallet
  components:
  - type: Sprite
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet-centcomm.rsi
    state: closed

- type: entity
  parent: [Wallet, BaseSyndicateContraband]
  id: WalletSyndicate
  name: SyndieWallet
  components:
  - type: Sprite
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet-syndicate.rsi
    state: closed

- type: entity
  parent: Wallet
  id: WalletClown
  name: Honk Wallet
  description: Because even clowns can't buy things with happiness.
  components:
  - type: Sprite
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet-clown.rsi
    state: closed
  - type: Storage
    storageOpenSound:
      collection: BikeHorn
      params:
        variation: 0.125
    storageInsertSound:
