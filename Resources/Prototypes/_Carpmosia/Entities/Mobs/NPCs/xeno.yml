      Dead:
        Base: dead
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: FluorosulfuricAcid
        Quantity: 170
      - ReagentId: Happiness
        Quantity: 30
  - type: HTN
    rootTask:
      task: IdleCompound
