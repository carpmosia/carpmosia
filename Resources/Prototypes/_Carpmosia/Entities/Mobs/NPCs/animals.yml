- type: entity
  parent: MobMothroach
  id: MobSyndimothroach
  name: syndimothroach
  description: This is the result of a genetic engineering campaign of questionable ethics, aimed at producing a living weapon you can hold gently like a burger.
  components:
  - type: GhostRole
    name: ghost-role-information-syndimothroach-name
    description: ghost-role-information-syndimothroach-description
    rules: ghost-role-information-syndimothroach-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
  - type: Sprite
    sprite: _Carpmosia/Mobs/Animals/syndimothroach.rsi
  - type: Clothing
    sprite: _Carpmosia/Mobs/Animals/syndimothroach.rsi
  - type: MobPrice
    price: 700
  - type: Tag
    tags:
    - Trash
    - CannotSuicide
    - VimPilot
    - Unimplantable # better than syndicat when microbomb
  - type: NpcFactionMember
    factions:
    - Syndicate
    - Mouse
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 60
      behaviors:
      - !type:GibBehavior { }
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 15
    animation: WeaponArcBite
    damage:
      types:
        Slash: 4
        Piercing: 6
        Structural: 15
  # Copied from MobCatSpace
  - type: Temperature
  - type: TemperatureDamage
    heatDamageThreshold: 423
    coldDamageThreshold: 0
  - type: MovementAlwaysTouching
  - type: PressureImmunity
  - type: Insulated
  - type: Respirator
    minSaturation: 5.0

- type: entity
  parent: [ SolutionFood, SolutionTiny, SimpleSpaceMobBase ]
  id: MobBagFish
  name: bag fish
  description: An iddle widdle fish rolling around in a plastic bag!
  components:
  - type: Emoting
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _Carpmosia/Mobs/Animals/bagfish.rsi
    layers:
    - map: ["fish", "movement-fish"]
      state: fish
    - map: ["enum.DamageStateVisualLayers.Base", "movement-bag"]
      state: bag
  - type: SpriteMovement
    movementLayers:
      movement-bag:
        state: bag-moving
      movement-fish:
        state: fish-moving
    noMovementLayers:
      movement-bag:
        state: bag
      movement-fish:
        state: fish
  - type: RandomSprite
    available:
    - fish:
        fish: Rainbow
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.15
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      10: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bag
      Critical:
        Base: bag-dead
      Dead:
        Base: bag-dead
  - type: Item
    size: Tiny
  - type: Clothing
    quickEquip: false
    sprite: _Carpmosia/Mobs/Animals/bagfish.rsi
    slots:
    - HEAD
  - type: Tag
    tags:
    - CannotSuicide
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 2
      - ReagentId: Water
        Quantity: 10
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Blunt
        damage: 40
      behaviors:
      - !type:GibBehavior
        recursive: false
    - trigger: !type:DamageTypeTrigger
        damageType: Slash
        damage: 40
      behaviors:
      - !type:GibBehavior
        recursive: false
    - trigger: !type:DamageTypeTrigger
        damageType: Piercing
        damage: 40
      behaviors:
      - !type:GibBehavior
        recursive: false
    - trigger: !type:DamageTypeTrigger
        damageType: Heat
        damage: 60
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: MovementSpeedModifier
    baseWalkSpeed : 0.65
    baseSprintSpeed : 1.0
  - type: CombatMode
    combatToggleAction: ActionCombatModeToggleOff
  - type: MobPrice
    price: 100
  - type: Extractable
    grindableSolutionName: food
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 3
      - ReagentId: Water
        Quantity: 12
  - type: ZombieImmune

- type: entity
  parent: MobBaseAncestor
  id: MobKitti
  name: Kitti
  description: Cousins to the sentient race of cat people. Known for living in primitive box forts and knocking cups over.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      sprite: _Carpmosia/Mobs/Animals/kitti.rsi
      state: kitti
    - map: [ "overlay" ]
      sprite: _Carpmosia/Mobs/Animals/kitti.rsi
      state: overlay-none
    - map: [ "jumpsuit" ]
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
    - map: [ "ears" ]
    - map: [ "id" ]
    - map: [ "mask" ]
    - map: [ "head" ]
  - type: RandomSprite
    getAllGroups: true
    available:
    - enum.DamageStateVisualLayers.Base:
        kitti: KittiColors
    - overlay:
        overlay-none: ""
        overlay-belly: ""
        overlay-paws: ""
        overlay-both: ""
  - type: Speech
    speechSounds: Cat
    speechVerb: SmallMob
  - type: ReplacementAccent
    accent: cat
  - type: InteractionPopup
    successChance: 0.9
    interactSuccessString: petting-success-cat
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/cat_meow.ogg
    interactFailureSound:
      path: /Audio/Animals/cat_hiss.ogg
  - type: Deathgasp
    prototype: DefaultDeathgasp
  # Tajaran body temperature/thresholds
  - type: Temperature
    currentTemperature: 312.0
  - type: TemperatureDamage
    heatDamageThreshold: 322
    coldDamageThreshold: 245
    coldDamage:
      types:
        Cold: 0.08
    heatDamage:
      types:
        Heat: 2.0
  - type: ThermalRegulator
    normalBodyTemperature: 312.0
  - type: MeleeWeapon
    angle: 30
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Slash: 3
        Piercing: 5
  - type: Clumsy
    gunShootFailDamage:
      types:
        Blunt: 3
        Piercing: 4
        Heat: 5
    catchingFailDamage:
      types:
        Blunt: 1
    clumsySound:
      path: /Audio/Animals/cat_hiss.ogg
  - type: AlwaysRevolutionaryConvertible
  - type: GhostTakeoverAvailable
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-feline
  - type: GhostRole
    prob: 0.05
    makeSentient: true
    name: ghost-role-information-kitti-name
    description: ghost-role-information-kitti-description
    rules: ghost-role-information-nonantagonist-rules
