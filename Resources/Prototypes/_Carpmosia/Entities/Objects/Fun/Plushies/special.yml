# Special plushies reserved for in-jokes
- type: entity
  parent: PlushieLizard
  id: PlushieLizardScreaming
  name: screaming lizard plushie
  description: An adorable stuffed toy that resembles a nervous lizardperson. Even the smallest stimuli causes it to scream.
  components:
  - type: Sprite
    sprite: _Carpmosia/Objects/Fun/Plushies/Special/screaming.rsi
  - type: Item
    sprite: _Carpmosia/Objects/Fun/Plushies/Special/creaming.rsi
  - type: EmitSoundOnUse
    sound: &PlushieLizardScreamsSound
      path: /Audio/Voice/Reptilian/reptilian_scream.ogg
      params:
        volume: 0
        pitch: 1.3
        variation: 0.3
  - type: EmitSoundOnLand
    sound: *PlushieLizardScreamsSound
  - type: EmitSoundOnActivate
    sound: *PlushieLizardScreamsSound
  - type: EmitSoundOnTrigger
    sound: *PlushieLizardScreamsSound
  - type: EmitSoundOnCollide
    sound: *PlushieLizardScreamsSound
  - type: Edible
    useSound: *PlushieLizardScreamsSound
    transferAmount: 10
  - type: MeleeWeapon
    soundHit: *PlushieLizardScreamsSound
  - type: Clothing
    sprite: _Carpmosia/Objects/Fun/Plushies/Special/screaming.rsi
  - type: Explosive
    canCreateVacuum: false
    deleteAfterExplosion: false
    explosionType: Default
    repeatable: true
    maxIntensity: 0.01
    intensitySlope: 1
    totalIntensity: 0.01
  - type: ExplodeOnTrigger
  - type: TriggerOnLand
  - type: RandomChanceTriggerCondition
    successChance: 0.1
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceThatMakesYouScream
        Quantity: 30
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 10
      - ReagentId: JuiceThatMakesYouScream
        Quantity: 10

- type: entity
  parent: PlushieLizard
  id: PlushieLizardAxolotl
  name: cursed axolotl plushie
  description: An... adorable...? stuffed toy that resembles an axolotl. It turns to look RIGHT AT YOU. It can change colors based on solutions injected into it.
  components:
  - type: Sprite
    sprite: _Carpmosia/Objects/Fun/Plushies/Special/axolotl.rsi
    layers:
    - state: icon
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: _Carpmosia/Objects/Fun/Plushies/Special/axolotl.rsi
  - type: EmitSoundOnUse
    sound: &PlushieLizardAxelSound
      path: /Audio/Items/Toys/weh.ogg
      params:
        volume: 0
        pitch: 0.6
        variation: 0.3
  - type: EmitSoundOnLand
    sound: *PlushieLizardAxelSound
  - type: EmitSoundOnActivate
    sound: *PlushieLizardAxelSound
  - type: EmitSoundOnTrigger
    sound: *PlushieLizardAxelSound
  - type: EmitSoundOnCollide
    sound: *PlushieLizardAxelSound
  - type: Edible
    useSound: *PlushieLizardAxelSound
    transferAmount: 10
  - type: MeleeWeapon
    soundHit: *PlushieLizardAxelSound
  - type: Clothing
    sprite: _Carpmosia/Objects/Fun/Plushies/Special/axolotl.rsi
  - type: Extractable
    grindableSolutionName: food
    juiceSolution: null
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Fiber
        Quantity: 10
      - ReagentId: Blood
        Quantity: 10
  - type: MixableSolution
    solution: food
  - type: ExaminableSolution
    solution: food
    exactVolume: true
  - type: DrawableSolution
    solution: food
  - type: InjectableSolution
    solution: food
  - type: Appearance
  - type: SolutionContainerVisuals
    solutionName: food
    maxFillLevels: 4
    fillBaseName: fill-
    inHandsMaxFillLevels: 4
    inHandsFillBaseName: -fill-
    equippedMaxFillLevels: 4
    equippedFillBaseName: -fill-
