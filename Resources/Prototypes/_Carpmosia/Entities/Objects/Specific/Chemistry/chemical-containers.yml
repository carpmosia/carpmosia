- type: entity
  parent: [ SolutionLarge, DrinkBaseMaterialStrongPlastic, DrinkBase, DrinkBaseOpenable, DrinkVisualsAll ] # Carpmosia-edit - Closable Jugs
  id: Jug
  name: jug
  description: Used to contain a very large amount of chemicals or solutions. Chugging is extremely ill-advised.
  components:
  - type: Sprite
    sprite: _Carpmosia/Objects/Specific/Chemistry/jug.rsi # Carpmosia-edit - chem resprite
  # Carpmosia-start - Closable Jugs
    layers:
    - state: icon_empty
      map: ["enum.OpenableVisuals.Layer"]
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: icon_overlay # Carpmosia-edit - chem resprite
  # Carpmosia-end - Closable Jugs
  - type: Item
    size: Large
    sprite: _Carpmosia/Objects/Specific/Chemistry/jug.rsi # Carpmosia-edit - chem resprite
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    inHandsMaxFillLevels: 4 # Carpmosia-edit - chem resprite
  - type: ExaminableSolution
    exactVolume: true # Chemistry item
  # Carpmosia-start - Closable Jugs
  - type: Openable
    sound:
      collection: bottleOpenSounds
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  # Carpmosia-end - Closable Jugs
  - type: StaticPrice
    price: 60
  - type: Tag
    tags:
    - ChemDispensable

