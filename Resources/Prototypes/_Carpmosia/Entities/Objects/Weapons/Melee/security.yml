- type: entity
  parent: [ BaseItem, BasePointerHammer ]
  id: SecBreacher
  name: security breacher
  description: The ultimate breaching tool designed to destroy obstacles.
  components:
  - type: Sprite
    sprite: _Carpmosia/Objects/Weapons/Melee/secbreacher.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
        Structural: 5
    soundHit:
      collection: MetalThud
    swingLeft: true
    attackRate: 0.75
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 15
        Structural: 13
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: _Carpmosia/Objects/Weapons/Melee/secbreacher.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
