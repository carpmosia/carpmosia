- type: entity
  parent: [ BaseItem, BasePointerHammer ]
  id: SecBreacher
  name: security breacher
  description: The ultimate breaching tool designed to destroy obstacles and pry ANY door.
  components:
  - type: Sprite
    sprite: _Carpmosia/Objects/Weapons/Melee/secbreacher.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
        Structural: 15
    soundHit:
      collection: MetalThud
    swingLeft: true
    attackRate: 0.75
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
        Structural: 35
  - type: ToolTileCompatible
    delay: 0.5
  - type: Item
    size: Ginormous
  - type: Tool
    qualities:
    - Prying
    useSound: /Audio/Items/jaws_pry.ogg
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
  - type: Clothing
    sprite: _Carpmosia/Objects/Weapons/Melee/secbreacher.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
