- type: entity
  abstract: true
  parent: [ BaseItem, BasePointerDagger ]
  id: BaseBeamBladeWeapon
  components:
  - type: ItemToggle
    soundActivate:
      path: /Audio/Weapons/ebladeon.ogg #remind make custom
    soundDeactivate:
      path: /Audio/Weapons/ebladeoff.ogg #remind make custom
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Weapons/ebladehum.ogg #remind make custom
  - type: ComponentToggler
    components:
    - type: Tool
      qualities:
      - Slicing
    - type: DisarmMalus
      malus: 0.6
    - type: Execution
      doAfterDuration: 4.0
  - type: ItemToggleHot
  - type: ItemToggleSize
    activatedSize: Huge
  - type: ItemTogglePointLight
    toggleableVisualsColorModulatesLights: true
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/eblade1.ogg #remind make custom
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/eblade1.ogg #remind make custom
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnSwing:
      path: /Audio/Weapons/eblademiss.ogg #remind make custom
      params:
        variation: 0.125
    activatedDamage:
      types:
        Slash: 10
        Heat: 10
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1
    damage:
      types:
        Blunt: 4.5
  - type: Item
    size: Small
  - type: UseDelay
    delay: 1.0
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: blade
    inhandVisuals:
      left:
      - state: inhand-left-glow
        shader: unshaded
        map: [ "inhand-glow-left" ]
      - state: inhand-left-core
        shader: unshaded
      right:
      - state: inhand-right-glow
        shader: unshaded
        map: [ "inhand-glow-right" ]
      - state: inhand-right-core
        shader: unshaded
  - type: Reflect
  - type: IgnitionSource
    temperature: 1200

