- type: entity
  abstract: true
  id: BasePaperRed
  suffix: red
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper
      color: &red "#FFCDD2"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: *red
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundModulate: *red
    contentImageModulate: *red

- type: entity
  parent: [ BasePaperRed, Paper ]
  id: PaperColorRed
  description: A piece of red paper.

- type: entity
  parent: [ BasePaperRed, PaperOffice ]
  id: PaperOfficeColorRed
  description: A plain sheet of red office paper.

