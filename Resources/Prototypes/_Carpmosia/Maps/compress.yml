- type: gameMap
  id: CarpCompress
  mapName: 'Compress'
  mapPath: /Maps/_Carpmosia/compress.yml
  mapPreview: MapPreviewCompress
  minPlayers: 0
  maxPlayers: 20
  stations:
    Compress:
      stationProto: StandardNanotrasenStation
      components:
      - type: StationNameSetup
        shortName: Compress
        mapNameTemplate: '{0} Compress Station {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/Shuttles/emergency.yml
      - type: StationCargoShuttle
        path: /Maps/Shuttles/cargo.yml
      - type: StationJobs
        availableJobs: # 41 jobs total w/o latejoins & interns, 48 jobs total w/ latejoins & interns
        # Command (7)
          Captain:               [ 1, 1 ]
          HeadOfPersonnel:       [ 1, 1 ]
          HeadOfSecurity:        [ 1, 1 ]
          ChiefMedicalOfficer:   [ 1, 1 ]
          ChiefEngineer:         [ 1, 1 ]
          ResearchDirector:      [ 1, 1 ]
          Quartermaster:         [ 1, 1 ]
        # Security (4)
          Warden:                [ 1, 1 ]
          Detective:             [ 1, 1 ]
          SecurityOfficer:       [ 2, 2 ]
        # Cargo (3 - 4)
          SalvageSpecialist:     [ 1, 2 ] # salvage may have a latejoin friend as a treat
          CargoTechnician:       [ 2, 2 ]
        # Engineering (3 - 4)
          AtmosphericTechnician: [ 1, 1 ]
          StationEngineer:       [ 2, 3 ]
        # Medical (5)
          Chemist:               [ 1, 1 ]
          MedicalDoctor:         [ 2, 2 ]
          Paramedic:             [ 1, 1 ]
          # Psychologist:
        # Science (5 - 6)
          Scientist:             [ 2, 3 ] # science is pretty small, so it has fewer slots
          StationAi:             [ 1, 1 ]
          Borg:                  [ 2, 2 ]
        # Service (14)
          Bartender:             [ 1, 1 ]
          Botanist:              [ 1, 1 ]
          Chaplain:              [ 1, 1 ]
          Chef:                  [ 1, 1 ]
          Clown:                 [ 1, 1 ]
          Janitor:               [ 1, 1 ]
          Lawyer:                [ 1, 1 ]
          Librarian:             [ 1, 1 ]
          Mime:                  [ 1, 1 ]
          Musician:              [ 1, 1 ]
          Reporter:              [ 1, 1 ]
          ServiceWorker:         [ 2, 2 ]
        # Interns & Fallback (4)
          SecurityCadet:         [ 1, 1 ]
          TechnicalAssistant:    [ 1, 1 ]
          MedicalIntern:         [ 1, 1 ]
          ResearchAssistant:     [ 1, 1 ]
          Passenger:             [-1,-1 ]
