- type: gameMap
  id: CarpPlasma
  mapName: 'Plasma'
  mapPath: /Maps/_Carpmosia/plasma.yml
  mapPreview: MapPreviewPlasma
  minPlayers: 30
  maxPlayers: 80
  stations:
    Plasma:
      stationProto: StandardNanotrasenStation
      components:
      - type: StationNameSetup
        shortName: Plasma
        mapNameTemplate: '{0} Plasma {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/Shuttles/emergency_plasma.yml
      - type: StationCargoShuttle
        path: /Maps/Shuttles/cargo_plasma.yml
      - type: StationJobs
        availableJobs: # 66 jobs total w/o latejoins & interns, 95 jobs total w/ latejoins & interns
        # Command (7)
          Captain:               [ 1, 1 ]
          HeadOfPersonnel:       [ 1, 1 ]
          HeadOfSecurity:        [ 1, 1 ]
          ChiefMedicalOfficer:   [ 1, 1 ]
          ChiefEngineer:         [ 1, 1 ]
          ResearchDirector:      [ 1, 1 ]
          Quartermaster:         [ 1, 1 ]
        # Security (8 - 11)
          Warden:                [ 1, 1 ]
          Detective:             [ 1, 2 ]
          SecurityOfficer:       [ 6, 8 ]
        # Cargo (8 - 10)
          SalvageSpecialist:     [ 4, 4 ]
          CargoTechnician:       [ 4, 6 ]
        # Engineering (8)
          AtmosphericTechnician: [ 4, 4 ]
          StationEngineer:       [ 4, 4 ]
        # Medical (9)
          Chemist:               [ 2, 2 ]
          MedicalDoctor:         [ 4, 4 ]
          Paramedic:             [ 2, 2 ]
          Psychologist:          [ 1, 1 ]
        # Science (7 - 9)
          Scientist:             [ 4, 4 ]
          StationAi:             [ 1, 1 ]
          Borg:                  [ 2, 4 ]
        # Service (19 - 25)
          Bartender:             [ 2, 2 ]
          Botanist:              [ 2, 3 ]
          Chaplain:              [ 1, 1 ]
          Chef:                  [ 2, 2 ]
          Clown:                 [ 1, 2 ]
          Janitor:               [ 3, 3 ]
          Lawyer:                [ 1, 2 ]
          Librarian:             [ 1, 1 ]
          Mime:                  [ 1, 1 ]
          Musician:              [ 1, 1 ]
          Reporter:              [ 2, 3 ]
          ServiceWorker:         [ 2, 2 ]
        # Interns & Fallback (16)
          SecurityCadet:         [ 4, 4 ]
          TechnicalAssistant:    [ 4, 4 ]
          MedicalIntern:         [ 4, 4 ]
          ResearchAssistant:     [ 4, 4 ]
          Passenger:             [-1,-1 ]
