- type: gameMap
  id: CarpBox
  mapName: 'Box Station'
  mapPath: /Maps/_Carpmosia/box.yml
  mapPreview: MapPreviewBox
  minPlayers: 50
  stations:
    Box:
      stationProto: StandardNanotrasenStation
      components:
      - type: StationNameSetup
        shortName: Box
        mapNameTemplate: '{0} Box Station {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: 'TG'
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/Shuttles/emergency_box.yml
      - type: StationJobs
        availableJobs: # 63 jobs total w/o latejoins & interns, 82 jobs total w/ latejoins & interns
        # Command (7)
          Captain:               [ 1, 1 ]
          HeadOfPersonnel:       [ 1, 1 ]
          HeadOfSecurity:        [ 1, 1 ]
          ChiefMedicalOfficer:   [ 1, 1 ]
          ChiefEngineer:         [ 1, 1 ]
          ResearchDirector:      [ 1, 1 ]
          Quartermaster:         [ 1, 1 ]
        # Security (7 - 9)
          Warden:                [ 1, 1 ]
          Detective:             [ 1, 1 ]
          SecurityOfficer:       [ 5, 7 ]
        # Cargo (6)
          SalvageSpecialist:     [ 3, 3 ]
          CargoTechnician:       [ 3, 3 ]
        # Engineering (8)
          AtmosphericTechnician: [ 3, 3 ]
          StationEngineer:       [ 5, 5 ]
        # Medical (8)
          Chemist:               [ 2, 2 ]
          MedicalDoctor:         [ 4, 4 ]
          Paramedic:             [ 1, 1 ]
          Psychologist:          [ 1, 1 ]
        # Science (8 - 9)
          Scientist:             [ 5, 5 ]
          StationAi:             [ 1, 1 ]
          Borg:                  [ 2, 3 ]
        # Service (19)
          Bartender:             [ 2, 2 ]
          Botanist:              [ 3, 3 ]
          Chaplain:              [ 1, 1 ]
          Chef:                  [ 2, 2 ]
          Clown:                 [ 1, 1 ]
          Janitor:               [ 2, 2 ]
          Lawyer:                [ 2, 2 ]
          Librarian:             [ 1, 1 ]
          Mime:                  [ 1, 1 ]
          Musician:              [ 1, 1 ]
          Reporter:              [ 1, 1 ]
          ServiceWorker:         [ 2, 2 ]
        # Interns & Fallback (14 - 16)
          SecurityCadet:         [ 2, 4 ]
          TechnicalAssistant:    [ 4, 4 ]
          MedicalIntern:         [ 4, 4 ]
          ResearchAssistant:     [ 4, 4 ]
          Passenger:             [-1,-1 ]
