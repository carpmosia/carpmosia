# region Base
- type: construction
  abstract: true
  id: BaseAtmos
  placementMode: SnapgridCenter
  category: construction-category-atmospherics
  objectType: Structure
  canRotate: true

- type: construction
  abstract: true
  parent: BaseAtmos
  id: BaseGasPipe
  placementMode: AlignAtmosPipeLayers
  graph: GasPipe
  canBuildInImpassable: true # for player convenience

- type: construction
  abstract: true
  parent: BaseAtmos
  id: BaseGasDevice
  placementMode: AlignAtmosPipeLayers # Carpmosia-edit - Atmos Alt Prototypes
  conditions:
  - !type:NoUnstackableInTile

# we allow stacking for shit like radiators on top of atmosdevices
# for now (trademark patent pending)
- type: construction
  abstract: true
  parent: BaseAtmos
  id: BaseGasDeviceStackable

- type: construction
  abstract: true
  parent: BaseGasDevice
  id: BaseGasUnary
  graph: GasUnary

- type: construction
  abstract: true
  parent: BaseGasDevice
  id: BaseGasBinary
  graph: GasBinary
  # placementMode: AlignAtmosPipeLayers # most binary devices support layers # Carpmosia-edit - Atmos Alt Prototypes

- type: construction
  abstract: true
  parent: BaseGasDeviceStackable
  id: BaseGasBinaryStackable
  graph: GasBinary
  placementMode: AlignAtmosPipeLayers

- type: construction
  abstract: true
  parent: BaseGasDevice
  id: BaseGasTrinary
  graph: GasTrinary
# endregion Base

# region Machines
- type: construction
