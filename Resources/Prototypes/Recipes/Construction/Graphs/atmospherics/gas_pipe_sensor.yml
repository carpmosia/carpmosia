- type: constructionGraph
  id: !type:CreateVariants
    values: [ GasPipeSensor, GasPipeSensorAlt1, GasPipeSensorAlt2, GasPipeSensorAlt3, GasPipeSensorAlt4 ] # Carpmosia-edit - 5 pipe layers
  start: start
  graph:
  - node: start
    edges:
    - to: sensor
      steps:
      - material: Steel
        amount: 2
        doAfter: 1

  - node: sensor
    entity: !type:CreateVariants
      values: [ GasPipeSensor, GasPipeSensorAlt1, GasPipeSensorAlt2, GasPipeSensorAlt3, GasPipeSensorAlt4 ] # Carpmosia-edit - 5 pipe layers
    actions:
    - !type:SetAnchor
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity
      conditions:
      - !type:EntityAnchored
        anchored: false
      steps:
      - tool: Welding
        doAfter: 1
