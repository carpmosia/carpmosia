- type: entity
  parent: ClothingBackpackSyndicate
  id: ClothingBackpackSyndicateBundle
  abstract: true
  components:
  - type: Tag
    tags:
    - Backpack # ignore "WhitelistChameleon" tag

- type: entity
  parent: ClothingBackpackSyndicateBundle
  id: ClothingBackpackSyndicateRaidBundle
  name: syndicate raid suit bundle
  description: "Contains the Syndicate's durable raid armor suit."
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingOuterArmorRaid
        - id: ClothingHeadHelmetRaid
        - id: ClothingMaskGasSyndicate
        - id: ClothingHandsGlovesCombat

- type: entity
  parent: ClothingBackpackSyndicateBundle
  id: ClothingBackpackSyndicateATSHijackBundle
  name: syndicate ATS hijack kit
  description: "Contains items that will help assist you in fending off foes opposing your ATS hijack."
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskGasSyndicate
        - id: ClothingHandsGlovesCombat
        - id: WeaponPistolViper
        - id: MagazinePistol
        - id: MagazinePistol
        - id: MedkitCombat
        - id: ClothingOuterArmorBasic