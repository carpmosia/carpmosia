    # Carpmosia-start - New time requirements
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 6h
    # Carpmosia-end - New time requirements
  displayWeight: 95 # Carpmosia-edit - Reorder jobs
  startingGear: CMOGear
  icon: "JobIconChiefMedicalOfficer"
  supervisors: job-supervisors-captain
  guides: [ Command ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
