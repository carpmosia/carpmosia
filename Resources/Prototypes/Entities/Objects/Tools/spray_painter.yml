- type: entity
  parent: BaseItem
  id: SprayPainter
  name: spray painter
  description: A spray painter for painting airlocks, pipes, and other items.
  components:
  - type: Sprite
    sprite: Objects/Tools/spray_painter.rsi
    state: spray_painter
  - type: Item
    sprite: Objects/Tools/spray_painter.rsi
  - type: ActivatableUI
    key: enum.SprayPainterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SprayPainterUiKey.Key:
        type: SprayPainterBoundUserInterface
  - type: SprayPainter
    colorPalette:
      # Carpmosia-start - Better pipe palette
      red: '#fb2c36'
      yellow: '#efb100'
      green: '#00c950'
      cyan: '#00b8db'
      indigo: '#615fff'
      fuchsia: '#e12afb'
      white: '#ffffff'
      black: '#333333'
      # standard colors
      waste: '#ad46ff'
      distro: '#7ccf00'
      teg-hot: '#ff637e'
      teg-cold: '#00d5Be'
      teg-fuel: '#ff8904'
      teg-failsafe: '#00d492'
      # gas colors
      oxygen: '#2887e8'
      nitrogen: '#da1010'
      carbon-dioxide: '#4e4e4e'
      plasma: '#ff3300'
      tritium: '#13ff4b'
      water-vapour: '#bffffd'
      ammonia: '#56941e'
      nitrous-oxide: '#8F00ff'
      frezon: '#3a758c'
      # Carpmosia-end - Better pipe palette
  - type: StaticPrice
    price: 40
  - type: LimitedCharges
    maxCharges: 15
    lastCharges: 15
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  parent: SprayPainter
  id: SprayPainterRecharging
  suffix: Admeme
  components:
  - type: AutoRecharge
    rechargeDuration: 1

- type: entity
  parent: SprayPainter
  name: experimental spray painter
  description: An experimental recharging spray painter that can infinitely replicate compressed paint.
  id: SprayPainterBorg
  suffix: Borg
  components:
  - type: AutoRecharge
    rechargeDuration: 5

- type: entity
  parent: SprayPainter
  id: SprayPainterEmpty
  suffix: Empty
  components:
  - type: LimitedCharges
    lastCharges: -1

- type: entity
  parent: BaseItem
  id: SprayPainterAmmo
  name: compressed paint
  description: A cartridge of highly compressed paint, commonly used in spray painters.
  components:
  - type: SprayPainterAmmo
  - type: Sprite
    sprite: Objects/Tools/spray_painter.rsi
    state: ammo
  - type: Item
    sprite: Objects/Tools/spray_painter.rsi
    heldPrefix: ammo
  - type: PhysicalComposition
    materialComposition:
      Steel: 10
      Plastic: 10
  - type: StaticPrice
    price: 30
