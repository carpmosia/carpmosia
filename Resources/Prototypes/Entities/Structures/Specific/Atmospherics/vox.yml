- type: entity
  abstract: true
  parent: AirSensorBase
  id: AirSensorVoxBase
  suffix: Nitrogen # Carpmosia-edit - Pipe presets
  components:
  - type: AtmosMonitor
    gasThresholdPrototypes:
      Oxygen: voxOxygen
      Nitrogen: voxNitrogen
      CarbonDioxide: stationCO2
      Plasma: stationPlasma
      Tritium: stationTritium
      WaterVapor: stationWaterVapor
      Ammonia: stationAmmonia
      NitrousOxide: stationNO
      Frezon: danger

- type: entity
  parent: [AirSensorVoxBase, AirSensor]
  id: AirSensorNitrogen # Carpmosia-edit - Pipe presets

- type: entity
  parent: [BaseAtmosNitrogen, AirSensorVoxBase, GasVentPumpAlt2] # Carpmosia-edit - Pipe presets
  id: GasVentPumpNitrogen # Carpmosia-edit - Pipe presets

- type: entity
  parent: [BaseAtmosWaste, AirSensorVoxBase, GasVentScrubberAlt3] # Carpmosia-edit - Pipe presets
  id: GasVentScrubberNitrogen # Carpmosia-edit - Pipe presets
  components:
  - type: GasVentScrubber
    wideNet: true # Air alarm with auto mode overrides filters with hardcoded defaults so default to widenet
    filterGases:
    - Oxygen # filter out oxygen as well as regular harmful gases
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon

# use this to prevent overriding filters with hardcoded defaults
- type: entity
  parent: AirAlarm
  id: AirAlarmNitrogen # Carpmosia-edit - Pipe presets
  suffix: Nitrogen, auto mode disabled # Carpmosia-edit - Pipe presets
  components:
  - type: AirAlarm
    autoMode: false
