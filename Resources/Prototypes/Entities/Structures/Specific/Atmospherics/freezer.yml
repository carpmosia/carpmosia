- type: entity
  abstract: true
  parent: AirSensorBase
  id: AirSensorFreezerBase
  suffix: Freezer # Carpmosia-edit - Pipe presets
  components:
  - type: AtmosMonitor
    temperatureThresholdId: freezerTemperature

- type: entity
  parent: [AirSensorFreezerBase, AirSensor]
  id: AirSensorFreezer

- type: entity
  parent: [BaseAtmosDistro, AirSensorFreezerBase, GasVentPumpAlt4] # Carpmosia-edit - Pipe presets
  id: GasVentPumpFreezer

- type: entity
  parent: [BaseAtmosWaste, AirSensorFreezerBase, GasVentScrubberAlt3] # Carpmosia-edit - Pipe presets
  id: GasVentScrubberFreezer

# air alarm proto with auto: false to prevent the automatic switching of modes overriding the default values
- type: entity
  parent: AirAlarm
  id: AirAlarmFreezer
  suffix: Freezer, auto mode disabled # Carpmosia-edit - Pipe presets
  components:
  - type: AirAlarm
    autoMode: false
