- type: entity
  parent: [ BaseAirlockIndestructible, StructureHealthDoorStrong ]
  id: HighSecDoor
  name: high security door
  description: Keeps the bad out and keeps the good in.
  components:
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/airlock-vault.rsi
  - type: Door
    crushDamage:
      types:
        Blunt: 50
    # Carpmosia-start - New highsec sounds
    openSound:
      path: /Audio/_Carpmosia/Machines/airlock_open.ogg
    closeSound:
      path: /Audio/_Carpmosia/Machines/airlock_close.ogg
    # Carpmosia-end - New highsec sounds
  - type: Weldable
    fuel: 10
    time: 10
  # Carpmosia-start - New highsec sounds
  - type: DoorBolt
    boltUpSound:
      path: /Audio/_Carpmosia/Machines/boltsup.ogg
    boltDownSound:
      path: /Audio/_Carpmosia/Machines/boltsdown.ogg
  # Carpmosia-end - New highsec sounds
  - type: WiresPanelSecurity
    securityLevel: maxSecurity
  - type: Wires
    boardName: wires-board-name-highsec
    layoutId: HighSec
    alwaysRandomize: true
  - type: Damageable
    damageModifierSet: PlasteelStaticMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 350
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
          params:
            volume: -4
  - type: Construction
    graph: Airlock
    node: highSecDoor
  - type: Tag
    tags:
    - HighSecDoor
    # This tag is used to nagivate the Airlock construction graph. It's needed because this construction graph is shared between Airlock, AirlockGlass, and HighSecDoor
    - DoorRemoteWhitelist
    # This tag is used by door remotes to allow or not a door remote to normally be able to interact with a door
