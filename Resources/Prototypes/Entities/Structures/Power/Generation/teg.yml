- type: entity
  id: TegCenter
  name: thermo-electric generator
  description: A high efficiency generator that uses energy transfer between hot and cold gases to produce electricity.
  parent: BaseMachinePowered
  placement:
    mode: SnapgridCenter
  components:
    - type: Transform
      noRot: false
    - type: Sprite
      # Carpmosia-start - TEG resprite
      sprite: _Carpmosia/Structures/Power/Generation/teg_center.rsi
      layers:
        - state: active
          map: [ "enum.TegVisualLayers.CirculatorBase" ]
        - state: light
      # Carpmosia-end - TEG resprite
          shader: unshaded
          map: [ "enum.PowerDeviceVisualLayers.Powered" ]
          visible: false
    - type: GenericVisualizer
      visuals:
        # Carpmosia-start - TEG resprite
        enum.AnchorVisuals.Anchored:
          enum.TegVisualLayers.CirculatorBase:
            False: { state: passive }
            True: { state: active }
        # Carpmosia-end - TEG resprite
        enum.PowerDeviceVisuals.Powered:
          enum.PowerDeviceVisualLayers.Powered:
            True: { visible: true }
            False: { visible: false }

    - type: Anchorable
    - type: Pullable
    - type: NodeContainer
      examinable: true
      nodes:
        output:
          !type:CableDeviceNode
          nodeGroupID: HVPower
        teg:
          !type:TegNodeGenerator
          nodeGroupID: Teg
    - type: PowerMonitoringDevice
      group: Generator
      loadNode: output
      # Carpmosia-start - TEG resprite
      sprite: _Carpmosia/Structures/Power/Generation/teg_center.rsi
      state: icon
      # Carpmosia-end - TEG resprite
    - type: Rotatable

    # Note that only the TEG center is an AtmosDevice.
    # It fires processing on behalf of its connected circulators.
    - type: AtmosDevice
    - type: TegGenerator
      thermalEfficiency: 0.1
      powerFactor: 2

    - type: DeviceNetwork
      deviceNetId: AtmosDevices
      receiveFrequencyId: AtmosMonitor
      transmitFrequencyId: AtmosMonitor
      prefix: device-address-prefix-teg
      sendBroadcastAttemptEvent: true
      examinableAddress: true
    - type: WiredNetworkConnection

    - type: PowerSupplier
      # Have practically irrelevant supply ramping.
      # Ramping is effectively implemented by the TEG manually,
      # due to how power output is handled.
      supplyRampRate: 100000000
      supplyRampTolerance: 10000000000

    - type: Appearance
    - type: ApcPowerReceiver
      powerLoad: 1000

    - type: LitOnPowered
    - type: PointLight
      enabled: false
      castShadows: false
      radius: 1.5
      color: "#FFAA00"

    - type: AmbientSound
      volume: -4
      range: 6
      enabled: false
      sound:
        path: /Audio/Ambience/Objects/vending_machine_hum.ogg
    - type: GuideHelp
      guides:
      - TEG
      - Power
    - type: StealTarget
      stealGroup: Teg

- type: entity
  id: TegCirculator
  name: circulator
  description: Passes gas through the thermo-electric generator to exchange heat. Has an inlet and outlet port.
  parent: BaseMachine
  placement:
    mode: SnapgridCenter
  components:
    - type: Transform
      noRot: false

    # visuals
    - type: Sprite
      # Carpmosia-start - TEG resprite
      sprite: _Carpmosia/Structures/Power/Generation/teg_circ.rsi # Carpmosia-edit - 5 pipe layers
      layers:
        - state: passive
          map: [ "enum.TegVisualLayers.CirculatorBase" ]
        - state: light
          shader: unshaded
          map: [ "enum.TegVisualLayers.CirculatorLight" ]
          visible: false
        - state: light-pulse1
          shader: unshaded
          map: [ "pulseLight" ]
          visible: false
      # Carpmosia-end - TEG resprite
    # Carpmosia-start - 5 pipe layers
    - type: AtmosPipeLayers
      spriteLayersRsiPaths:
        # Carpmosia-start - TEG resprite
        enum.TegVisualLayers.CirculatorBase:
          Primary: _Carpmosia/Structures/Power/Generation/teg_circ.rsi
          Secondary: _Carpmosia/Structures/Power/Generation/teg_circ_alt1.rsi
          Tertiary: _Carpmosia/Structures/Power/Generation/teg_circ_alt2.rsi
          Quaternary: _Carpmosia/Structures/Power/Generation/teg_circ_alt3.rsi
          Quinary: _Carpmosia/Structures/Power/Generation/teg_circ_alt4.rsi
        # Carpmosia-end - TEG resprite
    # Carpmosia-end - 5 pipe layers

    - type: GenericVisualizer
      visuals:
        # Carpmosia-start - TEG resprite
        enum.AnchorVisuals.Anchored:
          enum.TegVisualLayers.CirculatorBase:
            False: { state: passive }
            True: { state: active }
        enum.TegVisuals.CirculatorPower:
          enum.TegVisualLayers.CirculatorLight:
            True: { visible: true }
            False: { visible: false }
          pulseLight:
            True: { visible: true }
            False: { visible: false }
        enum.TegVisuals.CirculatorSpeed:
          pulseLight:
            SpeedStill: { state: light-pulse1 }
            SpeedSlow: { state: light-pulse2 }
            SpeedFast: { state: light-pulse3 }
        # Carpmosia-end - TEG resprite

    - type: Appearance
    - type: PointLight
      enabled: false
      castShadows: false
      radius: 1.5
      color: "#CC00FF"

    # tags
    - type: Tag
      tags:
        - Unstackable

    # basic interactions
    - type: Rotatable
    - type: Anchorable
    - type: Pullable
    - type: GuideHelp
      guides:
      - TEG
      - Power

    # functionality
    - type: NodeContainer
      nodes:
        inlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: North
          volume: 100
        outlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: South
          volume: 100
        circulator:
          !type:TegNodeCirculator
          nodeGroupID: Teg

    - type: AtmosUnsafeUnanchor
    - type: PipeRestrictOverlap
    - type: TegCirculator
    - type: StealTarget
      stealGroup: Teg

- # Spawned by the client-side circulator examine code to indicate the inlet/outlet direction.
  type: entity
  id: TegCirculatorArrow
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: Markers/teg_arrow.rsi
      color: "#FFFFFFBB"
      layers:
        - state: arrow
          offset: 0, 0.75
        - state: arrow
          offset: 0, -0.75
    - type: TimedDespawn
      lifetime: 2
    - type: Tag
      tags:
        - HideContextMenu
